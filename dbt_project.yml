# dbt_project.yml — the project's "settings page"
name: o2c_recon
version: "1.0.0"
profile: o2c_recon          # must match the top name in profiles.yml

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

# vars = project-wide settings any model can read with {{ var('name') }}.
# Override on the command line: dbt build --vars '{as_of_date: 2026-11-01}'
vars:
  as_of_date: '2026-10-01'    # "today" for the dataset; the bank data stops here
  max_bank_fee_jpy: 880       # biggest transfer fee (振込手数料) a customer may deduct

models:
  o2c_recon:
    staging:
      +materialized: view     # staging = light cleanup, so a view is enough
    intermediate:
      +materialized: view
    marts:
      +materialized: table    # marts = what people query, so store them as tables
